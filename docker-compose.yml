services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vector}
      POSTGRES_DB: ${POSTGRES_DB:-vector}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vector_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vector -d vector"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 3s

  mock-connectors:
    build:
      context: ./backend
      dockerfile: Dockerfile.mock-connectors
    ports:
      - "${MOCK_CONNECTORS_PORT:-9183}:9183"
    environment:
      VECTOR_MOCK_SEED: ${VECTOR_MOCK_SEED:-42}
    volumes:
      - ./backend/mock_connectors:/app/mock_connectors
    command: >
      uvicorn mock_connectors.unified:app
      --host 0.0.0.0
      --port 9183
      --reload
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:9183/health\", timeout=2).read()"',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Connector secrets (Slack, GitHub, etc.) come only from `env_file` — do NOT repeat them under
    # `environment:` with `${VAR:-}`. Compose resolves `${VAR:-}` before the container starts; if that
    # yields empty (shell/export quirks), those empty values OVERRIDE `env_file` and wipe real keys.
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://vector:vector@postgres:5432/vector}
      DATABASE_URL_TEST: ${DATABASE_URL_TEST:-postgresql+psycopg://vector:vector@postgres:5432/vector_test}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me-use-openssl-rand-hex-32}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/auth/google/callback}
      # Mock runs as `mock-connectors` below; process env overrides `.env` (pydantic-settings).
      # Remove this line if the API container must call a mock on the host instead.
      VECTOR_MOCK_CONNECTOR_BASE_URL: http://mock-connectors:9183
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-connectors:
        condition: service_healthy
    volumes:
      # Uvicorn cwd is `/app`; `Settings` loads `./.env` so Slack/GitHub/etc. apply without Compose interpolation.
      - ./.env:/app/.env:ro
      # Normative Cortex docs (Phase 04 doc-contract tests read under DOCS/cortex/04-identity).
      - ./DOCS:/app/DOCS:ro
      # Static wiring gates (continuity proofs, ECS caps, deploy workflows).
      - ./infra:/app/infra:ro
      - ./.github:/app/.github:ro
      - ./backend/scripts:/app/scripts:ro
      - ./backend/contracts:/app/contracts:ro
      - ./backend/Dockerfile:/app/Dockerfile:ro
      - ./backend/worker.Dockerfile:/app/worker.Dockerfile:ro
      # Admin revamp static gates read frontend operator surfaces.
      - ./frontend:/app/frontend:ro
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
      - ./backend/mock_connectors:/app/mock_connectors
      - ./backend/alembic:/app/alembic
      - ./backend/pyproject.toml:/app/pyproject.toml
      - ./backend/README.md:/app/README.md
      - ./backend/alembic.ini:/app/alembic.ini
      # GitHub App PEM: create repo ./secrets/github_app.pem (gitignored) and set
      # GITHUB_APP_PRIVATE_KEY_PATH=/run/secrets/github_app.pem in .env
      - ./secrets:/run/secrets:ro
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json
    depends_on:
      - backend

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://vector:vector@postgres:5432/vector}
      REDIS_URL: redis://redis:6379/0
      # Same as `backend`: `.env` often has 127.0.0.1 for host dev; inside Docker the mock is a
      # sibling service — without this, ingestion tasks cannot reach the mock GitHub/Linear APIs.
      VECTOR_MOCK_CONNECTOR_BASE_URL: http://mock-connectors:9183
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-connectors:
        condition: service_healthy
    volumes:
      - ./.env:/app/.env:ro
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
      - ./backend/pyproject.toml:/app/pyproject.toml
      - ./backend/alembic.ini:/app/alembic.ini
      - ./secrets:/run/secrets:ro
    command: >
      celery -A app.worker worker --loglevel=info
      -Q vector,cortex_live,cortex_replay

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://vector:vector@postgres:5432/vector}
      REDIS_URL: redis://redis:6379/0
      VECTOR_MOCK_CONNECTOR_BASE_URL: http://mock-connectors:9183
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./.env:/app/.env:ro
      - ./backend/src:/app/src
      - ./backend/pyproject.toml:/app/pyproject.toml
      - ./backend/alembic.ini:/app/alembic.ini
    command: >
      celery -A app.worker beat --loglevel=info

volumes:
  vector_pgdata:
