services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vector}
      POSTGRES_DB: ${POSTGRES_DB:-vector}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vector_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vector -d vector"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://vector:vector@postgres:5432/vector}
      DATABASE_URL_TEST: ${DATABASE_URL_TEST:-postgresql+psycopg://vector:vector@postgres:5432/vector_test}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
      - ./backend/alembic:/app/alembic
      - ./backend/pyproject.toml:/app/pyproject.toml
      - ./backend/README.md:/app/README.md
      - ./backend/alembic.ini:/app/alembic.ini
    command: >
      uvicorn vector.api.http.main:app
      --host 0.0.0.0
      --port 8000
      --reload

volumes:
  vector_pgdata:
