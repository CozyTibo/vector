name: Deploy

on:
  push:
    branches: [main]

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: vector-backend
  WORKER_REPOSITORY: vector-worker
  ECS_CLUSTER: vector-prod
  ECS_SERVICE: vector-backend-service
  ECS_TASK_DEFINITION: vector-backend
  # Worker: same cluster; task definition family name in ECS (must match console)
  ECS_WORKER_SERVICE: vector-worker-service
  ECS_WORKER_TASK_DEFINITION: vector-backend-worker
  # Container name in the API task definition (used for run-task overrides)
  ECS_CONTAINER_NAME: backend
  S3_FRONTEND_BUCKET: vector-frontend-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Verify OCTS walk policy packaging (P0-A)
        run: |
          cd backend
          python -m pip install --quiet -r requirements.txt jsonschema
          PYTHONPATH=src python -m pytest -q tests/vector/domains/cortex/traversal/test_walk_policy_packaging.py

      - name: Verify P1-D TCRE resume boundaries (step 1.4)
        run: |
          cd backend
          PYTHONPATH=src python -m pytest -q \
            tests/vector/domains/cortex/substrate_pipeline/test_continuity_p1_tcre_resume.py \
            tests/vector/domains/cortex/execution/test_single_tcre_execution_resume_boundary.py::test_verify_single_tcre_execution_resume_boundary \
            tests/vector/domains/cortex/execution/test_single_tcre_execution_resume_boundary.py::test_tcre_resume_module_has_no_continuation_coupling \
            tests/vector/domains/cortex/execution/test_tcre_worker_no_retrieval_materialization_boundary.py

      - name: Verify P1-D/E downstream proof evaluator (step 1.5)
        run: |
          cd backend
          PYTHONPATH=src python -m pytest -q \
            tests/vector/domains/cortex/substrate_pipeline/test_continuity_p1_downstream.py \
            tests/vector/domains/cortex/substrate_pipeline/test_continuity_p1_retrieval.py \
            tests/vector/domains/cortex/retrieval/test_p1c_retrieval_component_materialization.py \
            tests/vector/domains/cortex/execution/test_dual_lane_lease.py \
            tests/vector/domains/cortex/substrate_pipeline/test_continuity_p2_dual_lane.py

      - name: Verify P1-G continuity proof panel (step 2.2)
        run: |
          cd backend
          PYTHONPATH=src python -m pytest -q \
            tests/vector/domains/cortex/substrate_pipeline/test_continuity_proof_panel.py

      - name: Verify P2-A dual-lane worker (step 2.3)
        run: |
          cd backend
          PYTHONPATH=src python -m pytest -q \
            tests/vector/domains/cortex/execution/test_dual_lane_worker.py \
            tests/vector/domains/cortex/substrate_pipeline/test_continuity_p2_dual_lane_worker.py

      - name: Verify M3 forty-eight-hour AA clock (step 2.4)
        run: |
          cd backend
          PYTHONPATH=src python -m pytest -q \
            tests/vector/domains/cortex/substrate_pipeline/test_continuity_p2_aa_clock.py

      - name: Verify P2-C execution island registry (step 3.1)
        run: |
          cd backend
          PYTHONPATH=src python -m pytest -q \
            tests/vector/domains/cortex/operational_runtime/test_execution_island_registry.py \
            tests/vector/domains/cortex/substrate_pipeline/test_continuity_p3_island_registry.py

      - name: Verify P2-B event triggers (step 3.2)
        run: |
          cd backend
          PYTHONPATH=src python -m pytest -q \
            tests/vector/domains/cortex/execution/test_execution_event_triggers.py \
            tests/vector/domains/cortex/substrate_pipeline/test_continuity_p3_event_triggers.py

      - name: Verify P2-D per-island synthesis (step 3.3)
        run: |
          cd backend
          PYTHONPATH=src python -m pytest -q \
            tests/vector/domains/cortex/synthesis/test_synthesis_per_island.py \
            tests/vector/domains/cortex/substrate_pipeline/test_continuity_p3_per_island_synthesis.py

      - name: Verify P2-E ingest deferral monitoring (step 3.4)
        run: |
          cd backend
          PYTHONPATH=src python -m pytest -q \
            tests/vector/domains/cortex/execution/test_execution_ingest_deferral_monitoring.py \
            tests/vector/domains/cortex/substrate_pipeline/test_continuity_p3_ingest_deferral.py

      - name: Verify Phase A1 synthesis job lifecycle (step A.1)
        run: |
          cd backend
          VECTOR_SETTINGS_SKIP_DOTENV=1 PYTHONPATH=src python -m pytest -q \
            tests/vector/domains/cortex/synthesis/test_phase_a1_synthesis_job_lifecycle.py \
            tests/vector/domains/cortex/substrate_pipeline/test_continuity_p0_synthesis_job_lifecycle.py

      - name: Verify Phase A2 ECS deploy alignment (step A.2)
        run: |
          cd backend
          VECTOR_SETTINGS_SKIP_DOTENV=1 PYTHONPATH=src python -m pytest -q \
            tests/vector/domains/cortex/substrate_pipeline/test_continuity_p0_ecs_deploy_align.py

      - name: Verify Phase A3 TCRE queued drain (step A.3)
        run: |
          cd backend
          VECTOR_SETTINGS_SKIP_DOTENV=1 PYTHONPATH=src python -m pytest -q \
            tests/vector/domains/cortex/execution/test_phase_a3_tcre_job_lifecycle.py \
            tests/vector/domains/cortex/substrate_pipeline/test_continuity_p0_tcre_job_drain.py

      - name: Verify Phase A4 strict AA panel gates (step A.4)
        run: |
          cd backend
          VECTOR_SETTINGS_SKIP_DOTENV=1 PYTHONPATH=src python -m pytest -q \
            tests/vector/domains/cortex/substrate_pipeline/test_continuity_p0_aa_panel_strict.py \
            tests/vector/domains/cortex/substrate_pipeline/test_continuity_proof_panel.py

      - name: Verify Phase A5 trace-only ban (step A.5)
        run: |
          cd backend
          VECTOR_SETTINGS_SKIP_DOTENV=1 PYTHONPATH=src python -m pytest -q \
            tests/vector/domains/cortex/substrate_pipeline/test_continuity_p0_trace_only_policy.py

      - name: Verify Phase A6 synthesis terminal transitions (step A.6)
        run: |
          cd backend
          VECTOR_SETTINGS_SKIP_DOTENV=1 PYTHONPATH=src python -m pytest -q \
            tests/vector/domains/cortex/synthesis/test_phase_a6_synthesis_terminal_transitions.py \
            tests/vector/domains/cortex/substrate_pipeline/test_continuity_p0_synthesis_terminal_transitions.py

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -f backend/Dockerfile backend
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Get current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --region "$AWS_REGION" \
            --query taskDefinition \
            > task-def.json

      - name: Clean task definition
        run: |
          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy
          )' task-def.json > clean-task-def.json

      - name: Update image in task definition
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          jq --arg IMAGE "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            '.containerDefinitions[0].image = $IMAGE' \
            clean-task-def.json > new-task-def.json

      - name: Register new task definition
        run: |
          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json \
            --region "$AWS_REGION" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "REGISTERED_TASK_DEFINITION_ARN=$NEW_ARN" >> "$GITHUB_ENV"

      - name: Run database migrations (Alembic)
        run: |
          set -euo pipefail
          NETCFG=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query 'services[0].networkConfiguration.awsvpcConfiguration' \
            --output json)
          if [ "$NETCFG" = "null" ] || [ "$NETCFG" = "" ]; then
            echo "Could not read networkConfiguration from service $ECS_SERVICE"
            exit 1
          fi
          jq -n \
            --arg cluster "$ECS_CLUSTER" \
            --arg taskdef "$REGISTERED_TASK_DEFINITION_ARN" \
            --arg name "$ECS_CONTAINER_NAME" \
            --argjson vpc "$NETCFG" \
            '{
              cluster: $cluster,
              taskDefinition: $taskdef,
              launchType: "FARGATE",
              networkConfiguration: { awsvpcConfiguration: $vpc },
              overrides: {
                containerOverrides: [
                  { name: $name, command: ["alembic", "upgrade", "head"] }
                ]
              }
            }' > run-migration-task.json
          echo "Starting migration task…"
          TASK_ARN=$(aws ecs run-task \
            --cli-input-json file://run-migration-task.json \
            --region "$AWS_REGION" \
            --query 'tasks[0].taskArn' \
            --output text)
          if [ "$TASK_ARN" = "None" ] || [ -z "$TASK_ARN" ]; then
            echo "run-task did not return a task ARN"
            exit 1
          fi
          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN" \
            --region "$AWS_REGION"
          TASK_JSON=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN" \
            --region "$AWS_REGION" \
            --output json)
          EXIT=$(echo "$TASK_JSON" | jq -r --arg n "$ECS_CONTAINER_NAME" \
            '.tasks[0].containers[] | select(.name == $n) | .exitCode')
          if [ "$EXIT" = "null" ] || [ -z "$EXIT" ]; then
            echo "Could not read exitCode for container $ECS_CONTAINER_NAME"
            echo "$TASK_JSON" | jq '.tasks[0]' || true
            exit 1
          fi
          if [ "$EXIT" != "0" ]; then
            echo "alembic upgrade head failed (exit=$EXIT)"
            aws ecs describe-tasks \
              --cluster "$ECS_CLUSTER" \
              --tasks "$TASK_ARN" \
              --region "$AWS_REGION" \
              --query 'tasks[0].containers' \
              --output json || true
            exit 1
          fi
          echo "Migrations applied successfully."

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$REGISTERED_TASK_DEFINITION_ARN" \
            --force-new-deployment \
            --region "$AWS_REGION"

      - name: Build and push worker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t "$ECR_REGISTRY/$WORKER_REPOSITORY:$IMAGE_TAG" -f backend/worker.Dockerfile backend
          docker push "$ECR_REGISTRY/$WORKER_REPOSITORY:$IMAGE_TAG"

      - name: Get current worker task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_WORKER_TASK_DEFINITION" \
            --region "$AWS_REGION" \
            --query taskDefinition \
            > worker-task-def.json

      - name: Clean worker task definition
        run: |
          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy
          )' worker-task-def.json > clean-worker-task-def.json

      - name: Update worker image in task definition
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          jq --arg IMAGE "$ECR_REGISTRY/$WORKER_REPOSITORY:$IMAGE_TAG" \
            '.containerDefinitions[0].image = $IMAGE' \
            clean-worker-task-def.json > new-worker-task-def.json

      - name: Register new worker task definition
        run: |
          WORKER_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-worker-task-def.json \
            --region "$AWS_REGION" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "REGISTERED_WORKER_TASK_DEFINITION_ARN=$WORKER_TASK_DEF_ARN" >> "$GITHUB_ENV"

      - name: Deploy worker to ECS
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_WORKER_SERVICE" \
            --task-definition "$REGISTERED_WORKER_TASK_DEFINITION_ARN" \
            --force-new-deployment \
            --region "$AWS_REGION"

      - name: Wait for API and worker ECS rollouts
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" "$ECS_WORKER_SERVICE" \
            --region "$AWS_REGION"

      - name: Verify prod image tags match deploy SHA
        run: |
          set -euo pipefail
          api_img=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --region "$AWS_REGION" --query 'services[0].taskDefinition' --output text)
          worker_img=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_WORKER_SERVICE" \
            --region "$AWS_REGION" --query 'services[0].taskDefinition' --output text)
          api_tag=$(aws ecs describe-task-definition --task-definition "$api_img" --region "$AWS_REGION" \
            --query 'taskDefinition.containerDefinitions[0].image' --output text | awk -F: '{print $NF}')
          worker_tag=$(aws ecs describe-task-definition --task-definition "$worker_img" --region "$AWS_REGION" \
            --query 'taskDefinition.containerDefinitions[0].image' --output text | awk -F: '{print $NF}')
          echo "API image tag: $api_tag"
          echo "Worker image tag: $worker_tag"
          echo "Expected: $IMAGE_TAG"
          test "$api_tag" = "$IMAGE_TAG"
          test "$worker_tag" = "$IMAGE_TAG"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          npm ci
          npm run build

      - name: Upload frontend to S3
        run: |
          aws s3 sync frontend/dist "s3://$S3_FRONTEND_BUCKET" \
            --region "$AWS_REGION" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp frontend/dist/index.html "s3://$S3_FRONTEND_BUCKET/index.html" \
            --region "$AWS_REGION" \
            --cache-control "public,max-age=0,must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront
        env:
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -z "${DISTRIBUTION_ID:-}" ]; then
            echo "Skipping CloudFront invalidation (set secret CLOUDFRONT_DISTRIBUTION_ID when ready)."
            exit 0
          fi
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" \
            --region "$AWS_REGION"

