name: Deploy

on:
  push:
    branches: [main]

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: vector-backend
  WORKER_REPOSITORY: vector-worker
  ECS_CLUSTER: vector-prod
  ECS_SERVICE: vector-backend-service
  ECS_TASK_DEFINITION: vector-backend
  ECS_WORKER_SERVICE: vector-worker-service
  ECS_WORKER_TASK_DEFINITION: vector-backend-worker
  ECS_CORTEX_WORKER_SERVICE: vector-substrate-worker-service
  ECS_CORTEX_WORKER_TASK_DEFINITION: vector-substrate-worker
  ECS_CONTAINER_NAME: backend
  S3_FRONTEND_BUCKET: vector-frontend-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_GIT_SHA: ${{ github.sha }}
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build and push API and worker images (parallel)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -f backend/Dockerfile backend &
          PID_API=$!
          docker build -t "$ECR_REGISTRY/$WORKER_REPOSITORY:$IMAGE_TAG" -f backend/worker.Dockerfile backend &
          PID_WORKER=$!
          wait "$PID_API" "$PID_WORKER"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" &
          PUSH_API=$!
          docker push "$ECR_REGISTRY/$WORKER_REPOSITORY:$IMAGE_TAG" &
          PUSH_WORKER=$!
          wait "$PUSH_API" "$PUSH_WORKER"

      - name: Get current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --region "$AWS_REGION" \
            --query taskDefinition \
            > task-def.json

      - name: Clean task definition
        run: |
          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy
          )' task-def.json > clean-task-def.json

      - name: Align GitHub ingest caps on API task definition (D2)
        run: |
          python backend/scripts/ecs_align_github_ingest_caps.py \
            clean-task-def.json api-task-def-caps.json

      - name: Update image in task definition
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          jq --arg IMAGE "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
             --arg GIT_SHA "$IMAGE_TAG" \
             '.containerDefinitions[0].image = $IMAGE |
              .containerDefinitions[0].environment = (
                ((.containerDefinitions[0].environment // []) | map(select(.name != "VECTOR_GIT_SHA"))) +
                [{name: "VECTOR_GIT_SHA", value: $GIT_SHA}]
              )' \
            api-task-def-caps.json > new-task-def.json

      - name: Register new task definition
        run: |
          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json \
            --region "$AWS_REGION" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "REGISTERED_TASK_DEFINITION_ARN=$NEW_ARN" >> "$GITHUB_ENV"

      - name: Run database migrations (Alembic)
        run: |
          set -euo pipefail
          NETCFG=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query 'services[0].networkConfiguration.awsvpcConfiguration' \
            --output json)
          if [ "$NETCFG" = "null" ] || [ "$NETCFG" = "" ]; then
            echo "Could not read networkConfiguration from service $ECS_SERVICE"
            exit 1
          fi
          jq -n \
            --arg cluster "$ECS_CLUSTER" \
            --arg taskdef "$REGISTERED_TASK_DEFINITION_ARN" \
            --arg name "$ECS_CONTAINER_NAME" \
            --argjson vpc "$NETCFG" \
            '{
              cluster: $cluster,
              taskDefinition: $taskdef,
              launchType: "FARGATE",
              networkConfiguration: { awsvpcConfiguration: $vpc },
              overrides: {
                containerOverrides: [
                  { name: $name, command: ["alembic", "upgrade", "head"] }
                ]
              }
            }' > run-migration-task.json
          echo "Starting migration task…"
          TASK_ARN=$(aws ecs run-task \
            --cli-input-json file://run-migration-task.json \
            --region "$AWS_REGION" \
            --query 'tasks[0].taskArn' \
            --output text)
          if [ "$TASK_ARN" = "None" ] || [ -z "$TASK_ARN" ]; then
            echo "run-task did not return a task ARN"
            exit 1
          fi
          echo "Migration task: $TASK_ARN"
          # Default `aws ecs wait tasks-stopped` caps at ~10 minutes (100 × 6s).
          # Prod migrations can block on ingestion locks; retry the waiter up to ~45 minutes.
          WAIT_EXIT=255
          for attempt in 1 2 3 4 5; do
            set +e
            aws ecs wait tasks-stopped \
              --cluster "$ECS_CLUSTER" \
              --tasks "$TASK_ARN" \
              --region "$AWS_REGION"
            WAIT_EXIT=$?
            set -e
            if [ "$WAIT_EXIT" -eq 0 ]; then
              break
            fi
            STOPPED=$(aws ecs describe-tasks \
              --cluster "$ECS_CLUSTER" \
              --tasks "$TASK_ARN" \
              --region "$AWS_REGION" \
              --query 'tasks[0].lastStatus' \
              --output text 2>/dev/null || echo "UNKNOWN")
            if [ "$STOPPED" = "STOPPED" ]; then
              break
            fi
            echo "Migration task still running (attempt ${attempt}/5, lastStatus=${STOPPED}); waiting again…"
            sleep 5
          done
          if [ "$WAIT_EXIT" -ne 0 ]; then
            STOPPED=$(aws ecs describe-tasks \
              --cluster "$ECS_CLUSTER" \
              --tasks "$TASK_ARN" \
              --region "$AWS_REGION" \
              --query 'tasks[0].lastStatus' \
              --output text 2>/dev/null || echo "UNKNOWN")
            if [ "$STOPPED" != "STOPPED" ]; then
              echo "Migration task did not stop within waiter retries (lastStatus=${STOPPED})"
              exit 1
            fi
            echo "Waiter timed out but task is STOPPED; checking container exit code…"
          fi
          TASK_JSON=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN" \
            --region "$AWS_REGION" \
            --output json)
          EXIT=$(echo "$TASK_JSON" | jq -r --arg n "$ECS_CONTAINER_NAME" \
            '.tasks[0].containers[] | select(.name == $n) | .exitCode')
          if [ "$EXIT" = "null" ] || [ -z "$EXIT" ]; then
            echo "Could not read exitCode for container $ECS_CONTAINER_NAME"
            echo "$TASK_JSON" | jq '.tasks[0]' || true
            exit 1
          fi
          if [ "$EXIT" != "0" ]; then
            echo "alembic upgrade head failed (exit=$EXIT)"
            aws ecs describe-tasks \
              --cluster "$ECS_CLUSTER" \
              --tasks "$TASK_ARN" \
              --region "$AWS_REGION" \
              --query 'tasks[0].containers' \
              --output json || true
            exit 1
          fi
          echo "Migrations applied successfully."

      - name: Deploy API and worker to ECS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$REGISTERED_TASK_DEFINITION_ARN" \
            --force-new-deployment \
            --region "$AWS_REGION"
          aws ecs describe-task-definition \
            --task-definition "$ECS_WORKER_TASK_DEFINITION" \
            --region "$AWS_REGION" \
            --query taskDefinition \
            > worker-task-def.json
          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy
          )' worker-task-def.json > clean-worker-task-def.json
          python backend/scripts/ecs_align_github_ingest_caps.py \
            clean-worker-task-def.json worker-task-def-caps.json
          python backend/scripts/ecs_align_worker_queue_roles.py \
            worker-task-def-caps.json worker-ingestion-task-def.json worker-cortex-task-def.json \
            --cortex-family "$ECS_CORTEX_WORKER_TASK_DEFINITION"
          python backend/scripts/ecs_set_worker_task_images.py \
            worker-ingestion-task-def.json new-worker-task-def.json \
            --image "$ECR_REGISTRY/$WORKER_REPOSITORY:$IMAGE_TAG" \
            --git-sha "$IMAGE_TAG"
          REGISTERED_WORKER_TASK_DEFINITION_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-worker-task-def.json \
            --region "$AWS_REGION" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_WORKER_SERVICE" \
            --task-definition "$REGISTERED_WORKER_TASK_DEFINITION_ARN" \
            --force-new-deployment \
            --region "$AWS_REGION"
          python backend/scripts/ecs_set_worker_task_images.py \
            worker-cortex-task-def.json new-cortex-worker-task-def.json \
            --image "$ECR_REGISTRY/$WORKER_REPOSITORY:$IMAGE_TAG" \
            --git-sha "$IMAGE_TAG"
          REGISTERED_CORTEX_WORKER_TASK_DEFINITION_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-cortex-worker-task-def.json \
            --region "$AWS_REGION" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          CORTEX_SVC=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_CORTEX_WORKER_SERVICE" \
            --region "$AWS_REGION" \
            --query 'services[0].status' \
            --output text 2>/dev/null || echo "MISSING")
          if [ "$CORTEX_SVC" = "ACTIVE" ]; then
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$ECS_CORTEX_WORKER_SERVICE" \
              --task-definition "$REGISTERED_CORTEX_WORKER_TASK_DEFINITION_ARN" \
              --force-new-deployment \
              --region "$AWS_REGION"
          else
            NETCFG=$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_WORKER_SERVICE" \
              --region "$AWS_REGION" \
              --query 'services[0].networkConfiguration' \
              --output json)
            aws ecs create-service \
              --cluster "$ECS_CLUSTER" \
              --service-name "$ECS_CORTEX_WORKER_SERVICE" \
              --task-definition "$REGISTERED_CORTEX_WORKER_TASK_DEFINITION_ARN" \
              --desired-count 1 \
              --launch-type FARGATE \
              --network-configuration "$NETCFG" \
              --region "$AWS_REGION"
          fi
          # Remove legacy per-lane worker services (canon/identity merged into cortex worker).
          for LEGACY_SVC in vector-canon-worker-service vector-identity-worker-service; do
            LEGACY_STATUS=$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$LEGACY_SVC" \
              --region "$AWS_REGION" \
              --query 'services[0].status' \
              --output text 2>/dev/null || echo "MISSING")
            if [ "$LEGACY_STATUS" = "ACTIVE" ]; then
              aws ecs update-service \
                --cluster "$ECS_CLUSTER" \
                --service "$LEGACY_SVC" \
                --desired-count 0 \
                --region "$AWS_REGION" \
                --no-cli-pager
              aws ecs wait services-stable \
                --cluster "$ECS_CLUSTER" \
                --services "$LEGACY_SVC" \
                --region "$AWS_REGION"
              aws ecs delete-service \
                --cluster "$ECS_CLUSTER" \
                --service "$LEGACY_SVC" \
                --force \
                --region "$AWS_REGION" \
                --no-cli-pager
            fi
          done

      - name: Wait for API and worker ECS rollouts
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" "$ECS_WORKER_SERVICE" "$ECS_CORTEX_WORKER_SERVICE" \
            --region "$AWS_REGION"

      - name: Verify prod image tags match deploy SHA
        run: |
          set -euo pipefail
          api_img=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --region "$AWS_REGION" --query 'services[0].taskDefinition' --output text)
          worker_img=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_WORKER_SERVICE" \
            --region "$AWS_REGION" --query 'services[0].taskDefinition' --output text)
          cortex_img=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_CORTEX_WORKER_SERVICE" \
            --region "$AWS_REGION" --query 'services[0].taskDefinition' --output text)
          api_tag=$(aws ecs describe-task-definition --task-definition "$api_img" --region "$AWS_REGION" \
            --query 'taskDefinition.containerDefinitions[0].image' --output text | awk -F: '{print $NF}')
          worker_tags=$(aws ecs describe-task-definition --task-definition "$worker_img" --region "$AWS_REGION" \
            --query 'taskDefinition.containerDefinitions[*].image' --output text | tr '\t' '\n' | awk -F: '{print $NF}')
          cortex_tags=$(aws ecs describe-task-definition --task-definition "$cortex_img" --region "$AWS_REGION" \
            --query 'taskDefinition.containerDefinitions[*].image' --output text | tr '\t' '\n' | awk -F: '{print $NF}')
          echo "API image tag: $api_tag"
          echo "Worker image tags: $worker_tags"
          echo "Cortex worker image tags: $cortex_tags"
          echo "Expected: $IMAGE_TAG"
          test "$api_tag" = "$IMAGE_TAG"
          for tag in $worker_tags; do test "$tag" = "$IMAGE_TAG"; done
          for tag in $cortex_tags; do test "$tag" = "$IMAGE_TAG"; done

      - name: Post-deploy gate (ECS image probe)
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          ECS_CLUSTER: ${{ env.ECS_CLUSTER }}
          ECS_SERVICE: ${{ env.ECS_SERVICE }}
          ECS_WORKER_SERVICE: ${{ env.ECS_WORKER_SERVICE }}
          ECS_CORTEX_WORKER_SERVICE: ${{ env.ECS_CORTEX_WORKER_SERVICE }}
        run: |
          set -euo pipefail
          cd backend
          PYTHONPATH=src python scripts/substrate_post_deploy_gate.py \
            --expected-sha "$IMAGE_TAG" \
            --json

      - name: Upload frontend to S3
        run: |
          aws s3 sync frontend/dist "s3://$S3_FRONTEND_BUCKET" \
            --region "$AWS_REGION" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp frontend/dist/index.html "s3://$S3_FRONTEND_BUCKET/index.html" \
            --region "$AWS_REGION" \
            --cache-control "public,max-age=0,must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront
        env:
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -z "${DISTRIBUTION_ID:-}" ]; then
            echo "Skipping CloudFront invalidation (set secret CLOUDFRONT_DISTRIBUTION_ID when ready)."
            exit 0
          fi
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" \
            --region "$AWS_REGION"
