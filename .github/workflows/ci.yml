name: CI

# PR gate: frontend build + substrate coherence (Wave 5). Production deploy runs on push to main (see deploy.yml).
on:
  pull_request:

jobs:
  backend-substrate-coherence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cortex ingestion + canon tests
        working-directory: backend
        env:
          VECTOR_SETTINGS_SKIP_DOTENV: "1"
          DATABASE_URL: postgresql+psycopg://vector:vector@localhost:5432/vector_test
          SECRET_KEY: unit-test-secret-key-min-32-characters-long!
        run: |
          PYTHONPATH=src python -m pytest -q \
            -m "not e2e" \
            tests/vector/domains/cortex/ingestion/ \
            tests/vector/domains/cortex/canon/ \
            tests/vector/api/http/test_admin_cortex_ingestion_step6.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Typecheck and build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.example.com
        run: |
          npm ci
          npm run build
