[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-backend"
version = "0.1.0"
description = "Execution intelligence platform — backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "bcrypt>=4",
  "celery[redis]>=5.4",
  "email-validator>=2.0",
  "fastapi>=0.115",
  "google-auth>=2.35",
  "httpx>=0.27",
  "itsdangerous>=2.2",
  "openai>=1.54",
  "psycopg[binary]>=3.2",
  "psycopg2-binary>=2.9",
  "pydantic-settings>=2.6",
  "pyjwt[crypto]>=2.10",
  "python-jose[cryptography]>=3.3",
  "redis>=5.0",
  "requests>=2.32",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.32",
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: uses test DB or external IO",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
files = ["src/vector", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "app.worker"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = "app.celery_app"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = "app.tasks.ingestion"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
