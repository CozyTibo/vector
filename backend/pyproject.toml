[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-backend"
version = "0.1.0"
description = "Execution intelligence platform — backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "bcrypt>=4",
  "celery[redis]>=5.4",
  "email-validator>=2.0",
  "fastapi>=0.115",
  "google-auth>=2.35",
  "httpx>=0.27",
  "jinja2>=3.1",
  "itsdangerous>=2.2",
  "jsonschema>=4.23",
  "openai>=1.54",
  "psycopg[binary]>=3.2",
  "psycopg2-binary>=2.9",
  "pydantic-settings>=2.6",
  "pyjwt[crypto]>=2.10",
  "python-jose[cryptography]>=3.3",
  "redis>=5.0",
  "requests>=2.32",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.32",
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vector.infrastructure.email" = ["assets/*.png", "templates/**/*.j2"]
"vector.domains.cortex.reasoning" = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: uses test DB or external IO",
  "e2e: slow end-to-end flows (DB-heavy); excluded from make test-fast",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = false
warn_unused_ignores = false
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
files = ["src/vector", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disable_error_code = [
  "type-arg",
  "arg-type",
  "list-item",
  "call-overload",
  "misc",
  "index",
  "attr-defined",
  "assignment",
  "union-attr",
  "no-untyped-call",
  "unused-ignore",
  "no-any-return",
  "func-returns-value",
]

[[tool.mypy.overrides]]
module = "mock_connectors.*"
strict = false
warn_unreachable = false
warn_unused_ignores = false
disallow_untyped_defs = false
disable_error_code = [
  "type-arg",
  "arg-type",
  "assignment",
  "union-attr",
  "misc",
  "call-overload",
  "no-any-return",
  "index",
  "operator",
]

[[tool.mypy.overrides]]
module = "vector.domains.cortex.identity.worker_dispatch"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jsonschema"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "vector.infrastructure.db.models.*"
disable_error_code = ["no-untyped-call"]

[[tool.mypy.overrides]]
module = "vector.domains.cortex.canonical.transform_runtime"
